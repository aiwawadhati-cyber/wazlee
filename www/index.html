<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1565D8">
<title>Wazlee</title>
<link rel="icon" href="img/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wazlee">
<meta name="description" content="Wazlee — waktu solat JAKIM, kiblat, Al-Quran, doa, zikir, musafir, nota & alat harian.">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="tb-back" id="btnBack" aria-label="Back"></button>
  <div class="tb-brand" id="tbBrand">
    <img src="img/logo.png" alt="" class="tb-logo">
    <div><h1>Wazlee</h1><small id="locLabel" data-i18n="loc.detecting"></small></div>
  </div>
  <h2 class="tb-title" id="tbTitle"></h2>
  <button class="tb-lang" id="btnLang" aria-label="Language"></button>
  <button class="tb-act" id="btnRefreshLoc" aria-label="Location"></button>
</header>

<main id="main">

<!-- ================= UTAMA ================= -->
<section class="page" id="pg-home">
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-greet" id="hGreet"></div>
        <div class="hero-date" id="hDate">—</div>
        <div class="hero-hijri" id="hHijri">—</div>
      </div>
      <button class="zone-chip" data-go="zon" id="hZone">—</button>
    </div>
    <div class="hero-next">
      <span data-i18n="home.next"></span>
      <div class="hero-next-row"><strong id="hNextName">—</strong><em id="hNextAt"></em></div>
      <div class="countdown" id="hCountdown">--:--:--</div>
    </div>
    <div class="pchips" id="hChips" data-go="solat"></div>
  </div>

  <button class="mus-banner hidden" id="musBanner" data-go="musafir"><span class="chip-ic g-teal" data-ic="car"></span><span class="grow"><b data-i18n="mu.bannerT"></b><small id="musBannerS"></small></span><i data-ic="chevron-right"></i></button>

  <button class="ram-home hidden" id="ramHome" data-go="ramadan"></button>
  <button class="jum-home hidden" id="jumHome" data-go="jumaat"></button>
  <button class="wx-home hidden" id="wxHome" data-go="cuaca"></button>

  <div class="duo">
    <button class="mini-card green" data-go="langkah">
      <div class="ring-sm" id="hStepRing"></div>
      <div><small data-i18n="home.steps"></small><b id="hSteps">—</b><span id="hStepGoal" class="muted"></span></div>
    </button>
    <button class="mini-card cyan" data-go="air">
      <div class="mini-ic" data-ic="glass-water"></div>
      <div><small data-i18n="home.water"></small><b id="hWater">0/8</b><span class="muted" data-i18n="water.glasses"></span></div>
    </button>
  </div>

  <div class="card ayat-day" id="hAyat">
    <div class="card-head"><span class="chip-ic teal" data-ic="book-open"></span><div class="grow"><div class="card-title" data-i18n="home.ayatToday"></div><small class="muted" id="hAyatRef"></small></div>
    <button class="icbtn" id="hAyatImg" aria-label="image"><i data-ic="image"></i></button><button class="icbtn" id="hAyatPlay" aria-label="play"><i data-ic="volume-2"></i></button></div>
    <p class="arab q-ar" id="hAyatA"></p>
    <p class="maksud" id="hAyatT"></p>
  </div>

  <div class="card doa-day" id="hDoa" data-go="doa">
    <div class="card-head"><span class="chip-ic indigo" data-ic="book-heart"></span><div class="grow"><div class="card-title" data-i18n="home.doaToday"></div><small class="muted" id="hDoaT"></small></div><button class="icbtn" id="hDoaImg" aria-label="image"><i data-ic="image"></i></button></div>
    <p class="arab" id="hDoaA"></p>
    <p class="maksud" id="hDoaM"></p>
  </div>

  <div class="card quote-card">
    <div class="card-head"><span class="chip-ic orange" data-ic="quote"></span><div class="card-title" data-i18n="home.quote"></div></div>
    <p id="quoteText" class="quote">—</p>
    <div class="row-btns end">
      <button class="btn soft sm" id="btnNextQuote"><i data-ic="refresh-cw"></i><span data-i18n="btn.another"></span></button>
      <button class="btn soft sm" id="btnImgQuote"><i data-ic="image"></i><span data-i18n="img.share"></span></button>
      <button class="btn soft sm" id="btnShareQuote"><i data-ic="share-2"></i><span data-i18n="btn.share"></span></button>
    </div>
  </div>

  <h3 class="sec" data-i18n="home.shortcuts"></h3>
  <div class="tiles" id="homeTiles"></div>
</section>

<!-- ================= IBADAH ================= -->
<section class="page" id="pg-ibadah">
  <div class="hub-hero indigo">
    <div><h2 data-i18n="tab.ibadah"></h2><p data-i18n="hub.ibadah"></p></div>
    <div class="hub-ic" data-ic="moon-star"></div>
  </div>
  <div class="list-tiles" id="ibadahList"></div>
</section>

<!-- ================= SIHAT ================= -->
<section class="page" id="pg-sihat">
  <div class="hub-hero green">
    <div><h2 data-i18n="tab.sihat"></h2><p data-i18n="hub.sihat"></p></div>
    <div class="hub-ic" data-ic="heart-pulse"></div>
  </div>
  <div class="card step-summary" data-go="langkah">
    <div class="ring-lg" id="sStepRing"></div>
    <div class="ss-stats">
      <div><b id="sSteps">—</b><small data-i18n="steps.today"></small></div>
      <div class="ss-row"><span><i data-ic="route"></i><b id="sKm">0</b> km</span><span><i data-ic="flame"></i><b id="sKcal">0</b> kcal</span></div>
      <small class="src-tag" id="sSrc"></small>
    </div>
  </div>

  <div class="card hc-card" id="hcCard">
    <div class="card-head">
      <span class="chip-ic pink" data-ic="activity"></span>
      <div class="grow"><div class="card-title">Health Connect</div><small class="muted" id="hcStatus"></small></div>
      <button class="icbtn hidden" id="hcRefresh" aria-label="Refresh"><i data-ic="refresh-cw"></i></button>
    </div>
    <div class="hc-grid hidden" id="hcGrid"></div>
    <div class="row-btns">
      <button class="btn hidden" id="hcConnect"><i data-ic="heart-pulse"></i><span data-i18n="hc.connect"></span></button>
      <button class="btn hidden" id="hcInstall"><i data-ic="arrow-left-right"></i><span data-i18n="hc.install"></span></button>
      <button class="btn soft sm hidden" id="hcManage"><i data-ic="settings"></i><span data-i18n="hc.manage"></span></button>
    </div>
    <p class="note" data-i18n="hc.privacy"></p>
  </div>

  <div class="list-tiles" id="sihatList"></div>
</section>

<!-- ================= ALAT ================= -->
<section class="page" id="pg-lagi">
  <button class="ilmu-banner" data-go="ilmu">
    <div><h2 data-i18n="ilmu.title"></h2><p data-i18n="ilmu.sub"></p><span class="stars-pill" id="lagiStars"></span></div>
    <div class="hub-ic" data-ic="trophy"></div>
  </button>
  <h3 class="sec" data-i18n="tab.alat"></h3>
  <div class="list-tiles" id="alatList"></div>
  <h3 class="sec" data-i18n="lagi.settings"></h3>
  <div class="list-tiles" id="lagiSet"></div>
</section>

<!-- ================= AL-QURAN ================= -->
<section class="page" id="pg-quran">
  <div class="hub-hero teal q-hero">
    <div><h2 data-i18n="tab.quran"></h2><p data-i18n="q.sub"></p></div>
    <button class="hub-ic" data-go="qset" aria-label="settings" data-ic="settings"></button>
  </div>
  <button class="card q-continue hidden" id="qContinue"></button>
  <button class="card kh-entry" data-go="hafalan"><span class="chip-ic g-pink" data-ic="graduation-cap"></span><span class="grow"><b data-i18n="tile.hafalan"></b><small data-i18n="tile.hafalan.s"></small></span><i data-ic="chevron-right" class="chev"></i></button>
  <button class="card kh-entry" data-go="khatam"><span class="chip-ic g-teal" data-ic="target"></span><span class="grow"><b data-i18n="tile.khatam"></b><small data-i18n="tile.khatam.s"></small></span><i data-ic="chevron-right" class="chev"></i></button>
  <div class="search-box"><i data-ic="search"></i><input type="search" id="qSearch" data-i18n-ph="q.searchPh"></div>
  <div class="seg2 q-seg"><button data-qt="surah" class="active" data-i18n="q.surah"></button><button data-qt="juz" data-i18n="q.juz"></button><button data-qt="bm" data-i18n="q.bookmarks"></button></div>
  <div id="qList"></div>
</section>

<section class="page" id="pg-surah" data-title="tab.quran">
  <div class="card s-head" id="sHead"></div>
  <div id="sAyat"></div>
  <div class="s-end" id="sEnd"></div>
</section>

<section class="page" id="pg-qset" data-title="q.settings">
  <div class="card">
    <div class="card-title" data-i18n="q.display"></div>
    <label class="lbl" data-i18n="q.translation"></label>
    <select id="qsTr"><option value="auto" data-i18n="q.trAuto"></option><option value="ms">Bahasa Melayu (Basmeih)</option><option value="en">English (Sahih International)</option><option value="both" data-i18n="q.trBoth"></option><option value="none" data-i18n="q.trNone"></option></select>
    <label class="switch-row"><span data-i18n="q.translit"></span><input type="checkbox" id="qsTl"></label>
    <label class="lbl"><span data-i18n="q.fontSize"></span> <b id="qsFsV"></b></label>
    <input type="range" id="qsFs" min="20" max="44" step="2">
    <p class="arab q-preview" id="qsPrev">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</p>
  </div>
  <div class="card">
    <div class="card-title" data-i18n="q.audio"></div>
    <label class="lbl" data-i18n="q.reciter"></label>
    <select id="qsRec"></select>
    <p class="note" data-i18n="q.audioNote"></p>
  </div>
  <div class="card">
    <div class="card-head"><div class="grow"><div class="card-title" data-i18n="q.downloads"></div><small class="muted" id="qsDlInfo"></small></div></div>
    <div id="qsDlList"></div>
  </div>
  <p class="note center" data-i18n="q.sources"></p>
</section>

<!-- ================= PERINGATAN ================= -->
<section class="page" id="pg-ingat" data-title="tile.ingat">
  <div class="hub-hero indigo"><div><h2 data-i18n="tile.ingat"></h2><p data-i18n="ing.sub"></p></div><div class="hub-ic" data-ic="bell"></div></div>
  <div id="ingList"></div>
  <h3 class="sec" data-i18n="ing.custom"></h3>
  <div id="ingCustom"></div>
  <div class="card">
    <div class="card-title" data-i18n="ing.add"></div>
    <input type="text" id="ingTitle" data-i18n-ph="ing.titlePh">
    <div class="two"><input type="time" id="ingTime" value="08:00"><button class="btn" id="ingAddBtn"><i data-ic="plus"></i><span data-i18n="ing.addBtn"></span></button></div>
    <div class="ing-days" id="ingDays"></div>
  </div>
  <p class="note" id="ingStatus"></p>
</section>

<!-- ================= MUSAFIR ================= -->
<section class="page" id="pg-musafir" data-title="tile.musafir">
  <div class="hub-hero teal"><div><h2 data-i18n="tile.musafir"></h2><p data-i18n="mu.sub"></p></div><div class="hub-ic" data-ic="car"></div></div>
  <div class="card mus-status" id="muStatus"></div>
  <div class="card">
    <div class="card-title"><i data-ic="house"></i> <span data-i18n="mu.home"></span></div>
    <p class="muted small" id="muHomeTxt"></p>
    <button class="btn soft block" id="muSetHome"><i data-ic="locate-fixed"></i><span data-i18n="mu.setHome"></span></button>
  </div>
  <div class="card">
    <div class="card-title"><i data-ic="route"></i> <span data-i18n="mu.dest"></span></div>
    <div class="row-flex"><div class="search-box grow"><i data-ic="search"></i><input type="search" id="muQ" data-i18n-ph="mu.destPh"></div><button class="icbtn solid" id="muGo" aria-label="search"><i data-ic="search"></i></button></div>
    <div id="muRes"></div>
    <div id="muDestTxt"></div>
  </div>
  <div class="card">
    <div class="card-title"><i data-ic="calendar"></i> <span data-i18n="mu.trip"></span></div>
    <div id="muTrip"></div>
  </div>
  <div class="card">
    <div class="card-title"><i data-ic="clock"></i> <span data-i18n="mu.windows"></span></div>
    <div id="muWin"></div>
  </div>
  <div class="card">
    <div class="card-title"><i data-ic="settings"></i> <span data-i18n="mu.thr"></span></div>
    <select id="muThr"></select>
    <p class="muted small" data-i18n="mu.thrNote" style="margin-top:8px"></p>
  </div>
  <h3 class="sec" data-i18n="mu.guide"></h3>
  <div id="muGuide"></div>
  <p class="note" data-i18n="mu.disclaimer"></p>
</section>

<!-- ================= HAFALAN ================= -->
<section class="page" id="pg-hafalan" data-title="tile.hafalan">
  <div class="hf-kids" id="hfKids"></div>
  <div class="card hidden" id="hfForm"><div class="card-title" data-i18n="hf.newKid"></div>
    <div class="row-flex"><input type="text" id="hfName" data-i18n-ph="hf.namePh"><button class="btn" id="hfSave" data-i18n="pwa.save"></button></div></div>
  <div class="card hf-empty" id="hfEmpty"><span class="hf-big" data-ic="graduation-cap"></span><b data-i18n="hf.emptyT"></b><p class="muted small" data-i18n="hf.emptyS"></p></div>
  <div id="hfMain" class="hidden">
    <div class="hf-stats" id="hfStats"></div>
    <div class="hf-tools"><button class="btn soft sm" id="hfHide"><i data-ic="eye"></i><span data-i18n="hf.test"></span></button><button class="btn soft sm" id="hfTr"><i data-ic="languages"></i><span data-i18n="mt.tr"></span></button>
      <select id="hfRep" class="auto"><option value="1">×1</option><option value="3" selected>×3</option><option value="5">×5</option><option value="10">×10</option></select></div>
    <div class="card hf-today" id="hfToday"></div>
    <div class="card hf-review hidden" id="hfReview"></div>
    <h3 class="sec" data-i18n="hf.progress"></h3>
    <div class="card" id="hfProg"></div>
    <h3 class="sec" data-i18n="hf.settings"></h3>
    <div class="card hf-set">
      <label class="lbl" data-i18n="hf.plan"></label><select id="hfPlan"></select>
      <div class="two" style="margin-top:10px"><div><label class="lbl" data-i18n="hf.per"></label><select id="hfPer"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select></div>
        <div><label class="lbl" data-i18n="hf.rec"></label><select id="hfRec"></select></div></div>
      <div id="hfRemBox"><label class="switch-row hf-rem-n"><span data-i18n="hf.remind"></span><input type="checkbox" id="hfRem"></label>
        <div class="two"><span class="muted small" data-i18n="kh.remTime"></span><input type="time" id="hfTime" value="07:00"></div>
        <button class="btn soft block hf-rem-w" id="hfIcs" style="margin-top:10px"><i data-ic="calendar"></i><span data-i18n="ics.add"></span></button></div>
      <button class="btn soft sm" id="hfDel" style="margin-top:12px"><i data-ic="trash-2"></i><span data-i18n="hf.del"></span></button>
    </div>
  </div>
  <p class="note" data-i18n="hf.note"></p>
</section>

<!-- ================= PANDUAN IBADAH ================= -->
<section class="page" id="pg-panduan" data-title="tile.panduan">
  <div class="pd-tabs" id="pdTabs"></div>
  <div class="seg2 pd-sex hidden" id="pdSex"><button data-f="0" data-i18n="pd.male"></button><button data-f="1" data-i18n="pd.female"></button></div>
  <div id="pdList"></div>
  <p class="note" id="pdNote"></p>
</section>

<!-- ================= AL-MA'THURAT ================= -->
<section class="page" id="pg-mathurat" data-title="tile.mathurat">
  <div class="seg2 mth-seg" id="mthSeg"><button data-m="pagi"><i data-ic="sunrise"></i> <span data-i18n="mt.pagiB"></span></button><button data-m="petang"><i data-ic="sunset"></i> <span data-i18n="mt.petangB"></span></button></div>
  <div class="mth-hero" id="mthHero"></div>
  <div class="card mth-opt">
    <label><input type="checkbox" id="mthRumi"> <span data-i18n="mt.rumi"></span></label>
    <label><input type="checkbox" id="mthTr"> <span data-i18n="mt.tr"></span></label>
    <span class="mth-fs" id="mthFs"><button data-fs="-2">A−</button><button data-fs="2">A+</button></span>
  </div>
  <div id="mthList"></div>
  <button class="btn soft block" id="mthReset"><i data-ic="rotate-ccw"></i><span data-i18n="mt.reset"></span></button>
  <p class="note" data-i18n="mt.note"></p>
</section>

<!-- ================= KALENDAR HIJRI ================= -->
<section class="page" id="pg-hijri" data-title="tile.hijri">
  <div class="hj-today" id="hjToday"></div>
  <div class="card">
    <div class="hj-nav"><button class="icbtn" id="hjPrev" aria-label="prev"><i data-ic="chevron-left"></i></button><div class="hj-title" id="hjTitle"></div><button class="icbtn" id="hjNext" aria-label="next"><i data-ic="chevron-right"></i></button></div>
    <div class="hj-grid" id="hjGrid"></div>
    <div class="hj-legend"><span><em class="d-ev"></em><span data-i18n="hj.lEv"></span></span><span><em class="d-sn"></em><span data-i18n="hj.lSn"></span></span><span><em class="d-hr"></em><span data-i18n="hj.lHr"></span></span></div>
    <div class="hj-detail" id="hjDetail"></div>
    <button class="btn soft sm" id="hjNow" data-i18n="hj.back"></button>
  </div>
  <h3 class="sec" data-i18n="hj.events"></h3>
  <div class="card" id="hjEvents"></div>
  <p class="note" data-i18n="hj.note"></p>
</section>

<!-- ================= RAMADAN ================= -->
<section class="page" id="pg-ramadan" data-title="tile.ramadan">
  <div class="rm-hero" id="rmHero"></div>
  <div class="card" id="rmTrack">
    <div class="card-title" data-i18n="rm.track"></div>
    <small class="muted" data-i18n="rm.trackHint"></small>
    <div class="rm-lbl" data-i18n="rm.fast"></div><div class="rm-grid" id="rmFast"></div>
    <div class="rm-lbl" data-i18n="rm.tarawih"></div><div class="rm-grid" id="rmTar"></div>
    <div class="rm-sum" id="rmSum"></div>
  </div>
  <div class="card"><div class="card-title" data-i18n="rm.qada"></div><div id="rmQada"></div></div>
  <div class="card" id="rmSahurBox"><label class="switch-row"><span data-i18n="rm.sahur"></span><input type="checkbox" id="rmSahur"></label><small class="muted" data-i18n="rm.sahurNote"></small></div>
  <h3 class="sec" data-i18n="rm.doa"></h3>
  <div id="rmDoa"></div>
  <h3 class="sec" data-i18n="rm.table"></h3>
  <div class="card rm-table" id="rmTable"></div>
  <p class="note" data-i18n="rm.note"></p>
</section>

<!-- ================= KHATAM ================= -->
<section class="page" id="pg-khatam" data-title="tile.khatam">
  <p class="kh-count" id="khCount"></p>
  <div id="khSetup" class="card">
    <div class="card-title" data-i18n="kh.setT"></div>
    <p class="muted small" data-i18n="kh.setS"></p>
    <div class="rm-lbl" data-i18n="kh.period"></div>
    <div class="nt-filter kh-days" id="khDays"></div>
    <input type="number" inputmode="numeric" id="khCustom" data-i18n-ph="kh.customPh">
    <div class="rm-lbl" data-i18n="kh.startFrom"></div>
    <select id="khFrom"></select>
    <button class="btn block" id="khStart" style="margin-top:14px"><i data-ic="target"></i><span data-i18n="kh.start"></span></button>
  </div>
  <div id="khPlan" class="hidden"></div>
</section>

<!-- ================= JUMAAT ================= -->
<section class="page" id="pg-jumaat" data-title="tile.jumaat">
  <div class="rm-hero jm-hero" id="jmHero"></div>
  <div class="card"><div class="card-title" data-i18n="jm.sunnah"></div><div id="jmList"></div></div>
  <div class="card jm-sel"><div><div class="card-title" data-i18n="jm.selawat"></div><small class="muted" data-i18n="jm.selawatS"></small></div><button class="jm-selbtn" id="jmSel"><b id="jmSelN">0</b><small>صلوات</small></button></div>
  <h3 class="sec" data-i18n="jm.masjid"></h3>
  <div class="card"><div id="jmFav"></div><div id="jmMasjid"></div></div>
  <div class="card" id="jmRemBox"><label class="switch-row"><span data-i18n="jm.remind"></span><input type="checkbox" id="jmRem"></label><small class="muted" data-i18n="jm.remindS"></small></div>
</section>

<!-- ================= CUACA ================= -->
<section class="page" id="pg-cuaca" data-title="tile.cuaca">
  <div class="wx-hero" id="wxHero"></div>
  <div class="row-flex"><div class="search-box grow"><i data-ic="map-pin"></i><input type="search" id="wxQ" data-i18n-ph="wx.locPh"></div>
    <button class="icbtn solid" id="wxGo" aria-label="search"><i data-ic="search"></i></button><button class="icbtn" id="wxRefresh" aria-label="refresh"><i data-ic="refresh-cw"></i></button></div>
  <div id="wxWarn"></div>
  <h3 class="sec" data-i18n="wx.week"></h3>
  <div class="card wx-days" id="wxDays"></div>
  <h3 class="sec" data-i18n="wx.quake"></h3>
  <div class="card" id="wxQuake"></div>
  <p class="note" data-i18n="wx.src"></p>
</section>

<!-- ================= NOTA ================= -->
<section class="page" id="pg-nota" data-title="tile.nota">
