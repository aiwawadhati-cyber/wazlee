name: Build Wazlee APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (sudah terpasang pada runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Azan (pilihan) — aktif jika assets/sounds/azan.mp3 wujud
        run: |
          # Kunci tandatangan TETAP supaya APK baharu boleh update atas versi lama (tanpa uninstall)
          KS=$PWD/native/android/wazlee-debug.keystore
          if [ -n "$WZ_KS_B64" ]; then echo "$WZ_KS_B64" | base64 -d > $RUNNER_TEMP/wz.keystore; KS=$RUNNER_TEMP/wz.keystore; fi
          printf '\nandroid { signingConfigs { debug { storeFile file("%s"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } } }\n' "$KS" >> android/app/build.gradle
          tail -2 android/app/build.gradle
          if [ -f assets/sounds/azan.mp3 ]; then
            echo 'window.WZ_FLAGS = { azan: true };' > www/build-flags.js
            echo "Azan: ON"
          else
            echo 'window.WZ_FLAGS = { azan: false };' > www/build-flags.js
            echo "Azan: OFF (bunyi notifikasi lalai)"
          fi

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Native plugin (pengira langkah) & versi
        env:
          WZ_KS_B64: ${{ secrets.WZ_KEYSTORE_B64 }}
        run: |
          PKG=android/app/src/main/java/my/digitalsys/wazlee
          cp native/android/*.java $PKG/
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VER}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          # Health Connect memerlukan Android 8.0+ (minSdk 26)
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          grep -n "minSdkVersion" android/variables.gradle
          if [ -f assets/sounds/azan.mp3 ]; then
            mkdir -p android/app/src/main/res/raw
            cp assets/sounds/azan.mp3 android/app/src/main/res/raw/azan.mp3
          fi

      - name: Widget (res) & manifest
        run: |
          cp -r native/android/res/. android/app/src/main/res/
          python3 native/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
          grep -c "WzWidgetReceiver\|ACTIVITY_RECOGNITION\|wz_info_" android/app/src/main/AndroidManifest.xml

      - name: Generate icons & splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1565D8' --splashBackgroundColor '#1565D8' --splashBackgroundColorDark '#061432'

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon --console=plain > ../build.log 2>&1; then
            tail -80 ../build.log
            grep -E "error:|e: |FAILED|AAPT|Error:|ERROR:" ../build.log | head -15 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          tail -5 ../build.log
          VER=$(node -p "require('../package.json').version")
          cp app/build/outputs/apk/debug/app-debug.apk ../Wazlee-v${VER}.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Wazlee-APK
          path: Wazlee-v*.apk

      - name: Terbit sebagai GitHub Release (pautan muat turun tetap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}-build${GITHUB_RUN_NUMBER}"
          cp Wazlee-v${VER}.apk Wazlee.apk
          gh release create "$TAG" Wazlee-v${VER}.apk Wazlee.apk \
            --title "Wazlee ${VER} (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK Wazlee ${VER}. Muat turun Wazlee.apk dan pasang (benarkan Install unknown apps)." \
            --latest
