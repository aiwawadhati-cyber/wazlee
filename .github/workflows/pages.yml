name: Terbit Wazlee Web (PWA)
on:
  push:
    branches: [main]
    paths: ['www/**', 'assets/sounds/**', 'scripts/build-web.sh', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v5
      - name: Bina PWA
        env:
          WZ_DOMAIN: ${{ vars.WZ_DOMAIN }}
        run: ./scripts/build-web.sh dist
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
